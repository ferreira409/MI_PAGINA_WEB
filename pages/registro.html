<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Mi Página Web</title>
  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <a href="../index.html" class="logo">MiLogo</a>
      <ul class="nav-links">
        <li><a href="../index.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Ingresar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section">
      <form id="form-registro" class="formulario">
        <h1>Crear cuenta</h1>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña (mínimo 6 caracteres)</label>
        <input type="password" id="password" name="password" minlength="6" required>

        <button type="submit" class="btn">Registrarme</button>
        <p id="mensaje" class="mensaje"></p>
        <p>¿Ya tienes cuenta? <a href="login.html" class="link">Ingresa aquí</a></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Mi Página Web</p>
  </footer>

  <script type="module" src="../assets/js/registro.js"></script>
</body>
</html>
